kind = "web"
previewPath = "/"
title = "Notion Hub"
version = "1.0.0"
id = "artifacts/notion-hub"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24928

[services.development]
run = "pnpm --filter @workspace/notion-hub run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/notion-hub", "run", "build" ]
publicDir = "artifacts/notion-hub/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24928"
BASE_PATH = "/"
